[package]
name = "scx_infinity"
version = "1.1.4"
authors = ["Maxim Eryomenko <maxim_eryomenko@rambler.ru>"]
edition = "2024"
rust-version = "1.91"
description = "Experimental bounded-LIFO sched_ext scheduler for the Infinity fair policy."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
ctrlc = "3"
libbpf-rs = "=0.27.2"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.4" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.4" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
scx_arena = { path = "../../../rust/scx_arena/scx_arena", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
simplelog = "0.12"
toml = "1"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }
